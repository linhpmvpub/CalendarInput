*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#182b42;font:16px/1.5 system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}header{background:#123c61;color:#fff;padding:18px max(22px,calc((100vw - 900px)/2));flex:none}header small{font-size:11px;letter-spacing:1.6px;color:#c6dbef}h1{font-size:25px;margin:5px 0}header p{margin:0;font-size:13px;color:#d7e7f5}main{flex:1;min-height:0;display:flex;flex-direction:column}iframe{width:100%;height:100%;border:0;flex:1;min-height:0}#notice{margin:30px auto;padding:24px;max-width:700px;background:white;border-radius:12px}[hidden]{display:none!important}@media(max-width:600px){header{padding:12px 18px}h1{font-size:21px}header p{font-size:12px}}
</style></head><body><header><small>CỔNG ĐĂNG KÝ LỊCH LÀM VIỆC</small><h1>Đăng ký lịch lãnh đạo</h1><p>Nhập và gửi ngay tại đây · Không cần đăng nhập · Giờ Việt Nam (UTC+7)</p></header><main><div id="notice" role="status">Đang tải form đăng ký…</div><iframe id="registration-app" title="Đăng ký lịch làm việc trực tiếp" hidden></iframe></main><script src="config.js?v=2"></script><script>
