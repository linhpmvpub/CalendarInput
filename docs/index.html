<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146d65"><meta name="description" content="Đăng ký lịch lãnh đạo, xem giờ bận/trống và gửi đăng ký chưa cố định ngày. Không cần đăng nhập."><title>Cổng đăng ký lịch công tác tuần UBND tỉnh Quảng Trị</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#172b3a;font:14px/1.5 system-ui,sans-serif;height:100vh;height:100dvh;min-width:0;width:100%;display:flex;flex-direction:column}header{height:58px;display:flex;align-items:center;gap:11px;padding:0 max(24px,calc((100vw - 1184px)/2));border-bottom:1px solid #e0e9e9;background:#fff;flex:none}.mark{flex-shrink:0;width:29px;height:29px;background:#146d65;border-radius:8px;display:grid;place-items:center;color:#fff}.brand{font-size:13px;letter-spacing:.2px;font-weight:750;line-height:1.45}header small{margin-left:auto;font-size:11px;color:#82979b}main{flex:1;min-height:0;min-width:0;width:100%;display:flex;flex-direction:column}iframe{display:block;min-width:0;max-width:100%;width:100%;height:100%;border:0;flex:1;min-height:0}#notice{margin:30px auto;padding:24px;max-width:700px;background:white;border-radius:12px}[hidden]{display:none!important}@media(max-width:600px){header{min-height:64px;height:auto;padding:10px 17px}.brand{font-size:12px;letter-spacing:0}header small{display:none}}
